<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102A56" />
      <stop offset="100%" stop-color="#1D4E89" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D62828" />
      <stop offset="100%" stop-color="#E63946" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  
  <!-- Campus / Academic Timetable Building Symbol -->
  <g transform="translate(64, 64) scale(0.75)">
    <!-- Base Campus Building -->
    <path d="M256 40 L60 140 L452 140 Z" fill="#FFFFFF" />
    <rect x="226" y="20" width="60" height="20" rx="4" fill="url(#accentGrad)" />
    
    <!-- Columns -->
    <rect x="90" y="150" width="36" height="180" rx="6" fill="#F5F7FB" />
    <rect x="170" y="150" width="36" height="180" rx="6" fill="#F5F7FB" />
    <rect x="250" y="150" width="36" height="180" rx="6" fill="#F5F7FB" />
    <rect x="330" y="150" width="36" height="180" rx="6" fill="#F5F7FB" />
    <rect x="410" y="150" width="36" height="180" rx="6" fill="#F5F7FB" />
    
    <!-- Base Foundation -->
    <rect x="60" y="330" width="392" height="30" rx="6" fill="#FFFFFF" />
    <rect x="40" y="360" width="432" height="24" rx="4" fill="url(#accentGrad)" />

    <!-- Clock / Timetable badge -->
    <circle cx="268" cy="240" r="48" fill="#102A56" stroke="#FFFFFF" stroke-width="8" />
    <line x1="268" y1="240" x2="268" y2="216" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
    <line x1="268" y1="240" x2="290" y2="240" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" />
    <circle cx="268" cy="240" r="5" fill="#FFFFFF" />
  </g>
  
  <!-- Subtitle Text -->
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="4">BCAS</text>
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" fill="#D62828" letter-spacing="2">COLOMBO CAMPUS</text>
</svg>
